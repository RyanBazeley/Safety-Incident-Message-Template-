<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form Validation</title>

<style>
  body {
    font-family: Arial, sans-serif;
  }

  #commentContainer {
    display: none;
    margin-top: 10px;
  }

  #commentError {
    color: red;
    display: none;
    margin-top: 5px;
  }
</style>
</head>

<body>

<form id="myForm">

  <p>Please select an option:</p>

  <label>
    <input type="radio" name="option" value="yes">
    Yes
  </label>

  <label>
    <input type="radio" name="option" value="no">
    No
  </label>

  <div id="commentContainer">
    <label for="comment"><strong>Why?</strong></label><br>
    <textarea id="comment" name="comment" rows="4" cols="40"></textarea>
    <div id="commentError">
      Please explain why no option was selected.
    </div>
  </div>

  <br>
  <button type="submit">Submit</button>

</form>

<script>
const form = document.getElementById("myForm");
const radios = document.querySelectorAll('input[name="option"]');
const commentContainer = document.getElementById("commentContainer");
const comment = document.getElementById("comment");
const commentError = document.getElementById("commentError");

function checkSelection() {
  const selected = document.querySelector('input[name="option"]:checked');

  if (!selected) {
    commentContainer.style.display = "block";
    comment.setAttribute("required", "required");
  } else {
    commentContainer.style.display = "none";
    comment.removeAttribute("required");
    commentError.style.display = "none";
  }
}

radios.forEach(radio => {
  radio.addEventListener("change", checkSelection);
});

form.addEventListener("submit", function(e) {
  const selected = document.querySelector('input[name="option"]:checked');

  if (!selected) {
    commentContainer.style.display = "block";

    if (comment.value.trim() === "") {
      e.preventDefault();
      commentError.style.display = "block";
    }
  }
});
</script>

</body>
</html>
